<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>블록 편집 실증</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="editor.css"></head>
<body class="editor-page"><header class="editor-header"><div><p class="small en">CONTENT STUDY 02</p><h1>블록으로 작업 기록하기.</h1></div><a href="review.html">대표 시안 ↗</a></header><div class="editor-notice">편집 실증용 테스트 프로젝트입니다. 저장 내용은 이 브라우저에만 남으며 사이트에 공개되지 않습니다.</div>
<main class="editor-layout"><section class="editing"><div class="editor-section"><label for="project-title">프로젝트 제목</label><input id="project-title" autocomplete="off"><label for="project-summary">짧은 소개</label><textarea id="project-summary" rows="3"></textarea></div><div class="editor-section"><div class="editor-section-top"><h2>본문 블록</h2><span id="block-count" class="small"></span></div><p class="small muted">블록을 선택해 내용을 편집하세요. 위·아래 버튼 또는 드래그로 순서를 바꿀 수 있습니다.</p><ol id="block-list" aria-label="본문 블록 순서"></ol><div class="add-block"><label for="block-type">추가할 블록</label><select id="block-type"><option value="text">제목·본문</option><option value="image">이미지</option><option value="pair">이미지 2열</option><option value="info">정보 목록</option><option value="space">구분·여백</option><option value="link">외부 링크</option><option value="custom">자유 HTML·CSS</option></select><button id="add">블록 추가 +</button></div><p class="small muted">자유 블록은 별도 문서에 격리됩니다. CSS 변수와 모바일 @media를 사용할 수 있습니다.</p></div><section class="editor-section" aria-labelledby="editing-heading"><h2 id="editing-heading">선택한 블록</h2><div id="block-fields"></div><div class="block-actions"><button id="duplicate">선택 블록 복제</button><button id="delete">선택 블록 삭제</button></div></section><div class="save-bar"><button id="undo" disabled>변경 되돌리기</button><button id="save" class="primary">브라우저에 저장</button><p id="save-status" role="status" aria-live="polite"></p></div></section>
<section class="preview-panel" aria-labelledby="preview-heading"><div class="preview-toolbar"><h2 id="preview-heading">미리보기</h2><label for="preview-width">화면 너비</label><select id="preview-width"><option value="1440">데스크톱 · 1440px</option><option value="390">모바일 · 390px</option><option value="360">모바일 · 360px</option><option value="768">태블릿 · 768px</option></select></div><p class="small muted">현재 편집 내용이 바로 반영됩니다. 화면은 영역에 맞게 축소 표시됩니다.</p><div id="preview-stage"><iframe id="editor-preview" src="editor-preview.html" title="편집 중인 프로젝트 미리보기"></iframe></div></section></main><script type="module" src="editor.mjs"></script></body></html>
