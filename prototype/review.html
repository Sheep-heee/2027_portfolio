<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대표 화면 비교</title><link rel="stylesheet" href="styles.css"><style>.board{padding:2rem}.board h1{font-size:2rem}.board>p{margin:1rem 0 2rem}.review-controls{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}.review-controls select{padding:0.625rem;background:var(--bg);border:1px solid var(--ink)}.frames{display:flex;gap:1.5rem;align-items:start;overflow:auto}.frames section{flex:none}.frames h2{font-family:var(--font-ko);font-weight:400;font-size:1rem;margin:0 0 0.75rem}.frames iframe{border:1px solid var(--line);background:var(--bg);height:56.25rem}.desktop{width:1440px;height:112.5rem!important;zoom:.5}.mobile{width:390px}@media(max-width:767px){.board{padding:1.25rem}.board h1{font-size:1.875rem}}</style></head><body><main class="board"><h1>대표 화면 · 디자인 검토</h1><p>왼쪽은 데스크톱, 오른쪽은 모바일의 실제 반응형 화면입니다. 데스크톱은 축소 표시됩니다. 가로 스크롤로 비교하거나 <a href="index.html">전체 화면 ↗</a>으로 확인하세요.</p><div class="review-controls"><label>화면 <select id="screen"><option value="home">홈</option><option value="projects">프로젝트 목록</option><option value="detail/web">프로젝트 상세</option><option value="contact">문의</option></select></label><label>모바일 너비 <select id="width"><option>390</option><option>360</option><option>768</option></select></label></div><div class="frames"><section><h2>데스크톱 · 1440px (50% 축소)</h2><iframe class="desktop" title="데스크톱 시안" src="index.html#home"></iframe></section><section><h2 id="mobile-label">모바일 · 390px</h2><iframe class="mobile" title="모바일 시안" src="index.html#home"></iframe></section></div></main><script>const frames=document.querySelectorAll('iframe');document.getElementById('screen').addEventListener('change',e=>frames.forEach(f=>f.src='index.html#'+e.target.value));document.getElementById('width').addEventListener('change',e=>{document.querySelector('.mobile').style.width=e.target.value+'px';document.getElementById('mobile-label').textContent='모바일 / 태블릿 · '+e.target.value+'px'});</script></body></html>
