<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>편집 미리보기</title><link rel="stylesheet" href="styles.css"><style>.preview-head{padding:1rem var(--gutter);border-bottom:1px solid var(--line);font-size:.875rem}.preview-block{margin-block:4rem}.preview-block.spacing-small{margin-block:2rem}.preview-block.spacing-large{margin-block:6rem}.preview-block.width-reading{max-width:740px;margin-inline:auto}.preview-block h2{font-size:1.875rem;margin-bottom:1.5rem}.preview-block p{white-space:pre-wrap;overflow-wrap:anywhere}.preview-block figure{margin:0}.preview-block img{width:100%;height:auto;max-height:50rem;object-fit:contain;background:var(--wash)}.preview-block .pair{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}.preview-block figcaption{font-size:.875rem;margin-top:1rem}.preview-block dl{border-top:1px solid var(--line)}.preview-block dl>div{display:grid;grid-template-columns:1fr 2fr;gap:2rem;padding:1rem 0;border-bottom:1px solid var(--line)}.preview-block dt,.preview-block dd{margin:0}.preview-block hr{border:0;border-top:1px solid var(--line)}@media(max-width:767px){.preview-block .pair{grid-template-columns:1fr}.preview-block{margin-block:3rem}.preview-block h2{font-size:1.5rem}.preview-block dl>div{grid-template-columns:1fr;gap:.5rem}}</style></head><body><header class="preview-head">[공개 이름] <span class="muted">/ 비공개 편집 미리보기</span></header><main class="wrap"><section class="page-heading"><p class="eyebrow en">PROJECT / CONTENT STUDY</p><h1 id="title" class="detail-heading"></h1><p id="summary" class="muted"></p></section><div id="blocks"></div></main><script type="module" src="editor-preview.mjs"></script></body></html>
